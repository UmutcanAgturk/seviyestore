name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin-tests:
    name: PHPUnit (${{ matrix.plugin }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: [seviye-core, seviye-security]
    defaults:
      run:
        working-directory: plugin/${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - run: composer install --no-interaction --prefer-dist

      - run: composer test

  coding-standards:
    name: Coding Standards (PHPCS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - run: composer install --no-interaction --prefer-dist

      - run: vendor/bin/phpcs
